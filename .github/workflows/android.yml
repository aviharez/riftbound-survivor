# Builds a debug APK on every push to main and publishes it to the
# "latest-build" pre-release, so the newest build can be installed straight
# from a phone browser:
#   https://github.com/aviharez/riftbound-survivor/releases/tag/latest-build
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.1 platforms;android-35"

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          echo "### $GITHUB_STEP"
          mkdir -p ~/godot-dl && cd ~/godot-dl
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: Install Godot
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          echo "### $GITHUB_STEP"
          cd ~/godot-dl
          unzip -q -o "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tpl"
          unzip -q -o "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$tpl/"
          ls "$tpl" | grep -i android

      - name: Configure Android export (SDK, JDK, fixed debug keystore)
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          echo "### $GITHUB_STEP"
          minor=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${minor}.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/ci/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          # version code must grow so the phone accepts the update over the old install
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg

      - name: Import project
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          godot --headless --path . --import || true

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/ci/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          exec > >(tee -a /tmp/ci.log) 2>&1
          echo "### $GITHUB_STEP"
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/riftbound-debug.apk
          test -s build/riftbound-debug.apk
          ls -la build

      - name: Report failure log as annotations
        if: failure()
        run: |
          [ -f /tmp/ci.log ] || exit 0
          tail -n 60 /tmp/ci.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/tail.txt
          echo "::error title=ci-log-tail::$(cat /tmp/tail.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: riftbound-apk-${{ github.run_number }}
          path: build/riftbound-debug.apk

      - name: Publish to the latest-build pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest build (#${{ github.run_number }})"
          prerelease: true
          make_latest: false
          body: |
            Debug APK built automatically from commit ${{ github.sha }}.
            Install `riftbound-debug.apk` on Android (allow "install unknown apps" for your browser).
            Updates install over the previous build; your academy save is kept.
          files: build/riftbound-debug.apk
          fail_on_unmatched_files: true
